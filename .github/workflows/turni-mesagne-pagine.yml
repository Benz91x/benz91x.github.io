# Farmacia di turno Mesagne: pagine per i motori di ricerca.
# Quando cambiano i dati (turni, farmacie, numeri utili) rifà le pagine statiche dei mesi e delle farmacie,
# la sitemap e l'elenco statico in index.html, e le pubblica. Poi avvisa Bing con IndexNow.
# Non serve fare niente a mano. Se il generatore trova un problema nei dati, si ferma e non pubblica.
name: Pagine Farmacia di turno Mesagne

on:
  push:
    branches: [main]
    paths:
      - "farmacia-di-turno-mesagne/*.json"
      - "farmacia-di-turno-mesagne/index.html"
      - "farmacia-di-turno-mesagne/strumenti/pagine.mjs"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: turni-mesagne-pagine
  cancel-in-progress: false

jobs:
  pagine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # sempre l'ultimo main, non il commit che ha avviato il job: nel frattempo può essere arrivato altro
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rifai e pubblica le pagine
        id: pubblica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tentativo in 1 2 3; do
            node farmacia-di-turno-mesagne/strumenti/pagine.mjs
            if git diff --quiet -- farmacia-di-turno-mesagne && [ -z "$(git ls-files --others --exclude-standard farmacia-di-turno-mesagne)" ]; then
              echo "Le pagine erano già aggiornate." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git add -A farmacia-di-turno-mesagne
            git commit -q -m "Farmacia di turno Mesagne: pagine aggiornate con i dati nuovi"
            if git push origin HEAD:main; then
              echo "cambiate=true" >> "$GITHUB_OUTPUT"
              echo "Pagine aggiornate e pubblicate." | tee -a "$GITHUB_STEP_SUMMARY"
              # chi pubblica con il token delle Actions non sempre fa ripartire GitHub Pages: lo chiediamo esplicitamente
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null 2>&1 || true
              exit 0
            fi
            echo "main è cambiato mentre lavoravo: riparto dall'ultima versione (tentativo $tentativo)."
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "Non sono riuscito a pubblicare le pagine dopo 3 tentativi." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Avvisa Bing e gli altri motori (IndexNow)
        if: steps.pubblica.outputs.cambiate == 'true'
        run: |
          chiave=$(ls farmacia-di-turno-mesagne | grep -E '^[0-9a-f]{32}\.txt$' | head -1 | sed 's/\.txt$//')
          [ -n "$chiave" ] || exit 0
          sleep 120   # il tempo perché GitHub Pages pubblichi le pagine nuove
          grep -o '<loc>[^<]*</loc>' farmacia-di-turno-mesagne/sitemap.xml | sed -E 's#</?loc>##g' | jq -R . | jq -s . > urls.json
          jq -n --arg k "$chiave" --slurpfile u urls.json '{host:"benz91x.github.io",key:$k,keyLocation:("https://benz91x.github.io/farmacia-di-turno-mesagne/"+$k+".txt"),urlList:$u[0]}' > indexnow.json
          codice=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data @indexnow.json https://api.indexnow.org/indexnow || true)
          echo "IndexNow: risposta $codice (200 o 202 = ricevuto)." | tee -a "$GITHUB_STEP_SUMMARY"
